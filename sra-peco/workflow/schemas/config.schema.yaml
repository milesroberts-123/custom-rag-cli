$schema: "https://json-schema.org/draft/2020-12/schema"
description: workflow configuration for the SRA PECO and germplasm labeling pipeline
type: object
properties:
  samples:
    type: string
    description: path to the SRA run sample sheet
  ncbi:
    type: object
    properties:
      email:
        type: string
        description: contact email sent with NCBI E-utilities requests
      api_key_env:
        type: string
        default: NCBI_API_KEY
      batch_size:
        type: integer
        default: 200
      sra_batch_size:
        type: integer
        default: 50
      max_retries:
        type: integer
        default: 5
    required:
      - email
  peco:
    type: object
    properties:
      url:
        type: string
      top_k:
        type: integer
        default: 30
      embed_model:
        type: string
        default: BAAI/bge-base-en-v1.5
      exposure_branch:
        type: string
        default: PECO:0001001
      study_branch:
        type: string
        default: PECO:0007231
      growth_system_root:
        type: string
        default: PECO:0007147
    required:
      - url
  paper:
    type: object
    properties:
      max_chars:
        type: integer
        default: 12000
    required:
      - max_chars
  tissue:
    type: object
    properties:
      categories:
        type: array
        items:
          type: string
        minItems: 1
      keywords:
        type: object
        additionalProperties:
          type: array
          items:
            type: string
        default: {}
      attribute_keys:
        type: array
        items:
          type: string
        default:
          - tissue
          - organism part
          - organ
          - tissue type
          - sample tissue
          - cell type
      other_description:
        type: string
        default: None of the listed categories fits.
    required:
      - categories
  germplasm:
    type: object
    properties:
      categories:
        type: array
        items:
          type: string
        minItems: 1
      attribute_keys:
        type: array
        items:
          type: string
        default:
          - genotype
          - genotype/variation
          - ecotype
          - cultivar
          - strain
          - sample name
          - description
          - tissue
      natural_accessions:
        type: array
        items:
          type: string
        default: []
      patterns:
        type: object
        additionalProperties:
          type: array
          items:
            type: string
        default: {}
      descriptions:
        type: object
        additionalProperties:
          type: string
        default: {}
    required:
      - categories
  review:
    type: object
    properties:
      tissue_confidence:
        type: number
        minimum: 0
        maximum: 1
        default: 0.6
      germplasm_confidence:
        type: number
        minimum: 0
        maximum: 1
        default: 0.6
      exposure_retrieval_score:
        type: number
        minimum: 0
        maximum: 1
        default: 0.55
      study_confidence:
        type: number
        minimum: 0
        maximum: 1
        default: 0.6
      flag_missing_paper:
        type: boolean
        default: true
      flag_low_confidence_paper:
        type: boolean
        default: true
    required:
      - tissue_confidence
      - germplasm_confidence
      - exposure_retrieval_score
      - study_confidence
      - flag_missing_paper
      - flag_low_confidence_paper
  models:
    type: object
    properties:
      tissue_backend:
        type: string
        enum:
          - decision
          - chat
        default: decision
      tissue:
        type: string
      tissue_decision:
        type: string
      germplasm_backend:
        type: string
        enum:
          - decision
          - chat
        default: decision
      germplasm:
        type: string
      germplasm_decision:
        type: string
      exposure:
        type: string
      study_backend:
        type: string
        enum:
          - decision
          - chat
        default: decision
      study:
        type: string
      study_decision:
        type: string
      summary:
        type: string
      tissue_params:
        type: object
        default: {}
      germplasm_params:
        type: object
        default: {}
      exposure_params:
        type: object
        default: {}
      study_params:
        type: object
        default: {}
      summary_params:
        type: object
        default: {}
    required:
      - tissue_backend
      - tissue
      - tissue_decision
      - germplasm_backend
      - germplasm
      - germplasm_decision
      - exposure
      - study_backend
      - study
      - study_decision
      - summary
  ollama:
    type: object
    properties:
      server_url:
        type: string
      api_key:
        type: string
    required:
      - server_url
      - api_key
required:
  - samples
  - ncbi
  - peco
  - paper
  - tissue
  - germplasm
  - review
  - models
  - ollama
