samples: config/samples.tsv

# Optional window batching: process the sheet in non-overlapping, ordered
# slices across invocations, e.g. --config batch_size=5000 batch_index=3.
# 0 disables batching; set both keys or neither. labels.tsv accumulates all
# completed runs from every window.
batch_size: 0
batch_index: 0

# Label rules process runs in chunk jobs: one interpreter/encoder load per
# chunk of this many runs instead of per run. Outputs stay per-run.
label_chunk_size: 50

ncbi:
  email: milesroberts@berkeley.edu
  api_key_env: NCBI_API_KEY
  batch_size: 200
  sra_batch_size: 50
  max_retries: 5

peco:
  url: http://purl.obolibrary.org/obo/peco.owl
  top_k: 30
  embed_model: BAAI/bge-base-en-v1.5
  exposure_branch: PECO:0001001
  study_branch: PECO:0007231
  growth_system_root: PECO:0007147
  # Additional exposure subtrees that double as growth-condition signals:
  # photoperiod/day length (PECO:0007128) and temperature regime (PECO:0007175).
  # Selected terms under any root populate growth_system_ids/labels in
  # labels.tsv while staying in the exposure annotation too.
  growth_system_extra_roots:
    - PECO:0007128
    - PECO:0007175

paper:
  max_chars: 12000

athrdb:
  # Curated Arabidopsis annotations from PlantRNADB (GEO GSM-keyed).
  # One serial Snakemake job queries the site, so the effective request rate
  # is at most one request per min_interval_seconds regardless of run count.
  enabled: true
  base_url: https://plantrnadb.com/athrdb/Search.php
  min_interval_seconds: 2.0
  # One-sided jitter: gaps are uniformly min_interval .. min_interval*(1+jitter).
  # 0 disables jitter, restoring an exact fixed interval.
  jitter_fraction: 0.25
  max_requests: 5000
  timeout: 60

tissue:
  # The paper's six categories, with flower and fruit separated.
  categories:
    - whole_plant
    - shoot
    - root
    - leaf
    - seed
    - flower
    - fruit
  keywords:
    whole_plant:
      - whole plant
      - seedling
      - plantlet
    shoot:
      - shoot
      - stem
      - hypocotyl
      - stems
    root:
      - root
      - roots
    leaf:
      - leaf
      - leaves
      - rosette
      - cotyledon
      - cotyledons
    seed:
      - seed
      - seeds
      - embryo
      - embryos
    flower:
      - flower
      - flowers
      - floral
      - inflorescence
      - bud
      - buds
      - pollen
    fruit:
      - fruit
      - silique
      - siliques
      - seed pod
  # Structured fields the rules layer may read. Free text (study titles,
  # abstracts) is model evidence only: keyword hits there produced most of the
  # wrong rule labels in the first window.
  rule_attribute_keys:
    - tissue
    - organism part
    - organ
    - tissue type
    - sample tissue
    - cell type
    - plant structure
    - plant anatomy
  # Plant Ontology IDs used by ENA in `plant structure` fields. These are
  # high-precision structured evidence, so they take precedence over keywords.
  po_terms:
    "PO:0000003": whole_plant
    "PO:0009006": shoot
    "PO:0009047": shoot
    "PO:0009005": root
    "PO:0025034": leaf
    "PO:0009010": seed
    "PO:0009046": flower
    "PO:0009001": fruit
  attribute_keys:
    - tissue
    - organism part
    - organ
    - tissue type
    - sample tissue
    - cell type
  other_description: >-
    None of the listed categories fits, or the sampled tissue is ambiguous.

germplasm:
  categories:
    - natural_accession
    - mutant
    - transgenic
    - hybrid
    - grafted
    - cell_culture
    - polyploid
    - aneuploid
    - unknown
  # Structured fields the rules layer may read. Study abstracts and sample
  # names are model evidence only; matching them produced false
  # natural_accession calls (e.g. an accession-shaped token inside an ENA
  # submitter ID for a transgenic library).
  rule_attribute_keys:
    - genotype
    - genotype/variation
    - ecotype
    - cultivar
    - strain
    - library name
    - experiment title
  attribute_keys:
    - genotype
    - genotype/variation
    - ecotype
    - cultivar
    - strain
    - sample name
    - description
    - tissue
  natural_accessions:
    - Col-0
    - Col0
    - Columbia
    - Landsberg erecta
    - Ler-0
    - Ler0
    - Ws-0
    - Ws0
    - Cvi-0
    - Bay-0
    - Sha-0
    - Kas-1
    - Tsu-1
    - Est-1
    - Rld-1
    - Lov-1
    - Fei-0
    - Br-0
    - Kz-9
    - Kn-0
    - No-0
    - Oy-0
    - Per-1
    - Sap-0
    - Sorbo
    - Mt-0
    - Bl-1
    - Bur-0
    - Ct-1
    - Edi-0
    - Ga-0
    - Gre-0
    - Hov-0
    - Kondara
    - Mh-1
    - Ms-0
    - NFA-8
    - NFA-10
    - PHW-2
    - Pu2-7
    - Ra-0
    - Rak-1
    - Rrs-7
    - Rrs-10
    - Van-0
    - VIN-3
    - Wei-0
    - Wt-5
    - Yo-0
    - Zdr-1
  patterns:
    mutant:
      - '\bSALK_\d+'
      - '\bSAIL_\d+'
      - '\bGABI_\d+'
      - '\bWiscDsLox\w*'
      - '\bFLAG_\d+'
      - '\bGT_\d+'
      - '\bSM_\d+'
      - '\bCS\d{3,}'
      - '\bN\d{3,}'
      - '\bmutant\b'
      - '\bknockout\b'
      - '\bknock-out\b'
      - '\bknockdown\b'
      - '\binsertion\b'
      - '\bEMS\b'
      - '\bpoint mutation\b'
      - '\bdeletion\b'
      - '\bnull allele\b'
    transgenic:
      - '\b35S\b'
      - '\bUBQ10\b'
      - '\bGFP\b'
      - '\bGUS\b'
      - '\bYFP\b'
      - '\bCFP\b'
      - '\bRNAi\b'
      - '\bamiR\w*'
      - '\bCRISPR\b'
      - '\bCas9\b'
      - '\bT-DNA\b'
      - '\boverexpression\b'
      - '\bover-expression\b'
      - '\bcomplementation\b'
      - '\breporter\b'
      - '\btransgenic\b'
    hybrid:
      - '\bhybrid\b'
      - '\bF1\b'
      - '\bcross\b'
    grafted:
      - '\bgraft\w*'
      - '\brootstock\b'
      - '\bscion\b'
    cell_culture:
      - '\bcell culture\b'
      - '\bsuspension\b'
      - '\bcallus\b'
      - '\bprotoplast\w*'
    polyploid:
      - '\bpolyploid\b'
      - '\btetraploid\b'
      - '\btriploid\b'
    aneuploid:
      - '\baneuploid\b'
  descriptions:
    natural_accession: >-
      A naturally occurring Arabidopsis thaliana accession or a wild-type
      plant with no engineered or induced mutation.
    mutant: >-
      A mutant line or mutant allele, including T-DNA, EMS, CRISPR, point
      mutation, knockout, or knockdown lines.
    transgenic: >-
      A transgenic or transformed line carrying a construct, reporter,
      overexpression cassette, RNAi, or complementation construct.
    hybrid: A hybrid or F1 cross between genotypes.
    grafted: A grafted plant with rootstock and scion.
    cell_culture: Suspension cells, callus, protoplasts, or other cultured cells.
    polyploid: A polyploid plant such as a tetraploid or triploid.
    aneuploid: An aneuploid plant.
    unknown: Insufficient evidence to determine the germplasm type.

rna_type:
  # Include ribo-depleted total RNA with polyA-selected mRNA.
  accepted_rna_types:
    - mrna
    - ribo_depleted_total_rna
  attribute_keys:
    - rna type
    - rna_type
    - library type
    - library_type
    - library preparation
    - library_preparation
    - rna extraction
    - rna_extraction
    - extraction method
    - assay type
    - assay_type
    - sequencing method
    - nucleic acid extraction
  min_confidence: 0.6

review:
  tissue_confidence: 0.6
  germplasm_confidence: 0.6
  exposure_retrieval_score: 0.55
  study_confidence: 0.6
  rna_type_confidence: 0.6
  # Compare AthRDB curation against the model labels after labeling (the
  # labelers themselves do not read AthRDB) and flag disagreements for review.
  athrdb_crosscheck: true

models:
  rna_type_backend: decision
  rna_type: qwen3.8
  rna_type_decision: tev1:4b
  tissue_backend: decision
  tissue: qwen3.8
  tissue_decision: tev1:4b
  germplasm_backend: decision
  germplasm: qwen3.8
  germplasm_decision: tev1:4b
  exposure: qwen3.8
  study_backend: decision
  study: qwen3.8
  study_decision: tev1:4b
  summary: qwen3.8
  rna_type_params:
    temperature: 0
  tissue_params:
    temperature: 0
  germplasm_params:
    temperature: 0
  exposure_params: {}
  study_params:
    temperature: 0
  summary_params:
    temperature: 0
    # Summaries run once per BioProject (thousands of times fewer calls than
    # the per-run labelers), so the latency of a reasoning trace is worth the
    # extraction quality there; the per-run label calls stay non-thinking.
    think: true

ollama:
  server_url: http://127.0.0.1:11434
  api_key: ollama
