repos:
  - repo: local
    hooks:
      - id: snakefmt
        name: snakefmt
        entry: snakefmt --check
        language: python
        additional_dependencies:
          - snakefmt==2.1.0
        files: ^workflow/(Snakefile|rules/.*\.smk)$
      - id: snakemake-lint
        name: snakemake lint
        entry: snakemake --lint
        language: python
        additional_dependencies:
          - snakemake==9.27.1
          - snakemake-executor-plugin-slurm==2.8.0
          - pandas>=2.2,<3
          - jsonschema>=4,<5
          - pyyaml>=6,<7
        files: ^(workflow/|config/|\.test/|\.snakemake-workflow-catalog\.yml$)
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: python
        additional_dependencies:
          - ruff==0.17.3
        files: ^(src/|workflow/scripts/|workflow/tests/|review_app/).*\.py$
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: python
        additional_dependencies:
          - ruff==0.17.3
        files: ^(src/|workflow/scripts/|workflow/tests/|review_app/).*\.py$
