target-version = "py312"
line-length = 88
# Snakemake injects this global into script files.
builtins = ["snakemake"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
# Snakemake script files import shared helpers below the injected preamble.
ignore = ["E402"]

[lint.isort]
known-first-party = ["evidence", "http_utils", "llm", "ncbi", "peco_utils", "script_logging", "skip"]
known-third-party = [
    "click",
    "llama_index",
    "numpy",
    "openai",
    "pandas",
    "pronto",
    "requests",
    "sentence_transformers",
    "torch",
]
