name: sra-peco

on:
  push:
    paths:
      - "workflow/**"
      - "config/**"
      - "review_app/**"
      - "src/**"
      - ".test/**"
      - ".snakemake-workflow-catalog.yml"
      - "README.md"
      - "ruff.toml"
      - ".github/workflows/sra-peco-ci.yml"
      - ".pre-commit-config.yaml"
  pull_request:
    paths:
      - "workflow/**"
      - "config/**"
      - "review_app/**"
      - "src/**"
      - ".test/**"
      - ".snakemake-workflow-catalog.yml"
      - "README.md"
      - "ruff.toml"
      - ".github/workflows/sra-peco-ci.yml"
      - ".pre-commit-config.yaml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install "snakemake==9.27.1" "snakemake-executor-plugin-slurm==2.8.0" "snakefmt==2.1.0" "pandas>=2.2,<3" "jsonschema>=4,<5" "pyyaml>=6,<7"
      - name: Format
        run: snakefmt --check workflow/
      - name: Lint
        run: bash scripts/lint-snakemake.sh
      - name: Dry run
        run: snakemake -n --cores 1
      - name: Catalog rulegraph
        run: snakemake -s workflow/Snakefile -d .test -c 1 --forceall --rulegraph >/dev/null

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.17.3"
      - name: Check format
        run: ruff format --check src workflow/scripts workflow/tests review_app
      - name: Lint
        run: ruff check src workflow/scripts workflow/tests review_app

  review-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r review_app/requirements-dev.txt
      - name: Test
        run: pytest -q review_app/tests workflow/tests
