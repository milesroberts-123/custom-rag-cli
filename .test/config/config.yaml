samples: config/samples.tsv
batch_size: 0
batch_index: 0
label_chunk_size: 2
exposure_chunk_size: 1

ncbi:
  email: test@example.com
  api_key_env: NCBI_API_KEY
  batch_size: 2
  sra_batch_size: 2
  max_retries: 1

peco:
  url: http://purl.obolibrary.org/obo/peco.owl
  top_k: 5
  embed_model: BAAI/bge-base-en-v1.5
  exposure_branch: PECO:0001001
  study_branch: PECO:0007231
  growth_system_root: PECO:0007147

paper:
  max_chars: 1000

athrdb:
  enabled: true
  base_url: https://plantrnadb.com/athrdb/Search.php
  min_interval_seconds: 0.0
  jitter_fraction: 0.0
  max_requests: 3
  timeout: 60

quant:
  targets: results/quant/targets.tsv
  reference_release: 60
  cdna_url: https://example.invalid/cdna.fa.gz
  genome_url: https://example.invalid/genome.fa.gz
  gtf_url: https://example.invalid/annotation.gtf.gz
  salmon_k: 31
  threads: 2
  se_fld_mean: 250
  se_fld_sd: 25
  tin_min_coverage: 10
  scratch: /tmp/quant-tmp
tissue:
  categories:
    - leaf
    - root
  keywords:
    leaf:
      - leaf
    root:
      - root
  attribute_keys:
    - tissue
  other_description: No listed tissue category fits.

germplasm:
  categories:
    - natural_accession
    - mutant
    - unknown
  attribute_keys:
    - genotype
    - ecotype
  natural_accessions:
    - Col-0
  patterns:
    mutant:
      - '\bmutant\b'
  descriptions:
    natural_accession: A natural accession or wild-type plant.
    mutant: A mutant line.
    unknown: Insufficient evidence.

rna_type:
  accepted_rna_types:
    - mrna
    - ribo_depleted_total_rna
  attribute_keys:
    - rna type
  min_confidence: 0.6

review:
  tissue_confidence: 0.5
  germplasm_confidence: 0.5
  exposure_retrieval_score: 0.55
  study_confidence: 0.5
  rna_type_confidence: 0.5

models:
  rna_type_backend: rules
  rna_type: test-model
  rna_type_decision: test-model
  rna_type_params: {}
  tissue_backend: chat
  tissue: test-model
  tissue_decision: test-model
  germplasm_backend: chat
  germplasm: test-model
  germplasm_decision: test-model
  exposure: test-model
  study_backend: chat
  study: test-model
  study_decision: test-model
  summary: test-model
  tissue_params: {}
  germplasm_params: {}
  exposure_params: {}
  study_params: {}
  summary_params:
    think: true

ollama:
  server_url: http://127.0.0.1:11434
  api_key: ollama
