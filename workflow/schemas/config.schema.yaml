$schema: "https://json-schema.org/draft/2020-12/schema"
description: workflow configuration for the SRA PECO and germplasm labeling pipeline
type: object
properties:
  samples:
    type: string
    description: path to the SRA run sample sheet
  batch_size:
    type: integer
    minimum: 0
    default: 0
    description: optional window size for batched invocations; 0 disables batching
  batch_index:
    type: integer
    minimum: 0
    default: 0
    description: one-based window index used together with batch_size
  label_chunk_size:
    type: integer
    minimum: 1
    default: 50
    description: runs processed per label chunk job; outputs stay per-run
  ncbi:
    type: object
    properties:
      email:
        type: string
        description: contact email sent with NCBI E-utilities requests
      api_key_env:
        type: string
        default: NCBI_API_KEY
      batch_size:
        type: integer
        default: 200
      sra_batch_size:
        type: integer
        default: 50
      max_retries:
        type: integer
        default: 5
    required:
      - email
  peco:
    type: object
    properties:
      url:
        type: string
      top_k:
        type: integer
        default: 30
      embed_model:
        type: string
        default: BAAI/bge-base-en-v1.5
      exposure_branch:
        type: string
        default: PECO:0001001
      study_branch:
        type: string
        default: PECO:0007231
      growth_system_root:
        type: string
        default: PECO:0007147
    required:
      - url
  paper:
    type: object
    properties:
      max_chars:
        type: integer
        default: 12000
    required:
      - max_chars
  athrdb:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
      base_url:
        type: string
      min_interval_seconds:
        type: number
        minimum: 0
      jitter_fraction:
        type: number
        minimum: 0
        maximum: 1
        default: 0.25
      max_requests:
        type: integer
        minimum: 0
      timeout:
        type: integer
        minimum: 1
    required:
      - enabled
      - base_url
      - min_interval_seconds
      - max_requests
      - timeout
  tissue:
    type: object
    properties:
      categories:
        type: array
        items:
          type: string
        minItems: 1
      keywords:
        type: object
        additionalProperties:
          type: array
          items:
            type: string
        default: {}
      attribute_keys:
        type: array
        items:
          type: string
        default:
          - tissue
          - organism part
          - organ
          - tissue type
          - sample tissue
          - cell type
      other_description:
        type: string
        default: None of the listed categories fits.
    required:
      - categories
  germplasm:
    type: object
    properties:
      categories:
        type: array
        items:
          type: string
        minItems: 1
      attribute_keys:
        type: array
        items:
          type: string
        default:
          - genotype
          - genotype/variation
          - ecotype
          - cultivar
          - strain
          - sample name
          - description
          - tissue
      natural_accessions:
        type: array
        items:
          type: string
        default: []
      patterns:
        type: object
        additionalProperties:
          type: array
          items:
            type: string
        default: {}
      descriptions:
        type: object
        additionalProperties:
          type: string
        default: {}
    required:
      - categories
  rna_type:
    type: object
    properties:
      accepted_rna_types:
        type: array
        items:
          type: string
        minItems: 1
        default:
          - mrna
          - ribo_depleted_total_rna
      attribute_keys:
        type: array
        items:
          type: string
        default:
          - rna type
          - rna_type
          - library type
          - library_type
          - library preparation
          - library_preparation
          - rna extraction
          - rna_extraction
          - extraction method
          - assay type
          - assay_type
          - sequencing method
          - nucleic acid extraction
      min_confidence:
        type: number
        minimum: 0
        maximum: 1
        default: 0.6
    required:
      - accepted_rna_types
  review:
    type: object
    properties:
      tissue_confidence:
        type: number
        minimum: 0
        maximum: 1
        default: 0.6
      germplasm_confidence:
        type: number
        minimum: 0
        maximum: 1
        default: 0.6
      exposure_retrieval_score:
        type: number
        minimum: 0
        maximum: 1
        default: 0.55
      study_confidence:
        type: number
        minimum: 0
        maximum: 1
        default: 0.6
      rna_type_confidence:
        type: number
        minimum: 0
        maximum: 1
        default: 0.6
      flag_missing_paper:
        type: boolean
        default: true
      flag_low_confidence_paper:
        type: boolean
        default: true
    required:
      - tissue_confidence
      - germplasm_confidence
      - exposure_retrieval_score
      - study_confidence
      - rna_type_confidence
      - flag_missing_paper
      - flag_low_confidence_paper
  models:
    type: object
    properties:
      rna_type_backend:
        type: string
        enum:
          - decision
          - chat
          - rules
        default: decision
      rna_type:
        type: string
      rna_type_decision:
        type: string
      rna_type_params:
        type: object
        default: {}
      tissue_backend:
        type: string
        enum:
          - decision
          - chat
        default: decision
      tissue:
        type: string
      tissue_decision:
        type: string
      germplasm_backend:
        type: string
        enum:
          - decision
          - chat
        default: decision
      germplasm:
        type: string
      germplasm_decision:
        type: string
      exposure:
        type: string
      study_backend:
        type: string
        enum:
          - decision
          - chat
        default: decision
      study:
        type: string
      study_decision:
        type: string
      summary:
        type: string
      tissue_params:
        type: object
        default: {}
      germplasm_params:
        type: object
        default: {}
      exposure_params:
        type: object
        default: {}
      study_params:
        type: object
        default: {}
      summary_params:
        type: object
        default: {}
    required:
      - rna_type_backend
      - rna_type
      - rna_type_decision
      - tissue_backend
      - tissue
      - tissue_decision
      - germplasm_backend
      - germplasm
      - germplasm_decision
      - exposure
      - study_backend
      - study
      - study_decision
      - summary
  ollama:
    type: object
    properties:
      server_url:
        type: string
      api_key:
        type: string
    required:
      - server_url
      - api_key
required:
  - samples
  - ncbi
  - peco
  - paper
  - athrdb
  - tissue
  - germplasm
  - rna_type
  - review
  - models
  - ollama
